<!doctype html>
<html lang="en-gb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Video player example</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
    <script src="./built/main.js" type="module"></script>
  </head>
  <body>
    <div class="player">
      <video controls>
        <source
          src="./assets/sintel-short.mp4"
          type="video/mp4" />
      </video>
      <div class="controls">
        <button
          class="play"
          data-icon="P"
          data-state="paused"
          aria-label="play pause toggle"></button>
        <button class="stop" data-icon="S" aria-label="stop"></button>
        <div class="timer">
          <div id="progress"></div>
          <div id="seeker"></div>
          <span>00:00</span>
        </div>
        <button class="rwd" data-icon="B" aria-label="rewind"></button>
        <button class="fwd" data-icon="F" aria-label="fast forward"></button>
      </div>
    </div>
    <p>
      Sintel &copy; copyright Blender Foundation |
      <a href="https://studio.blender.org/films/sintel/"
        >studio.blender.org/films/sintel/</a>
    </p>
  </body>
</html>
